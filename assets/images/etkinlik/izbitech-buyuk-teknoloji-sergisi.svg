<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" rx="16" fill="url(#bgGrad)" stroke="url(#gold)" stroke-width="2"/>
  
  <!-- Decorative Arch Background -->
  <path d="M 120,400 C 120,120 520,120 520,400" fill="none" stroke="rgba(217, 119, 6, 0.15)" stroke-width="2"/>
  <circle cx="320" cy="110" r="45" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Badge -->
  <rect x="230" y="30" width="180" height="32" rx="16" fill="rgba(245, 158, 11, 0.15)" stroke="url(#gold)" stroke-width="1"/>
  <text x="320" y="51" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#FDE68A" text-anchor="middle" letter-spacing="2">🌟 BÜYÜK ETKİNLİK</text>

  <!-- Title -->
  <text x="320" y="180" font-family="'Cinzel', serif" font-size="30" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">
    ENDERUN MECLİSİ
  </text>
  <text x="320" y="215" font-family="'Cinzel', serif" font-size="22" font-weight="700" fill="url(#gold)" text-anchor="middle">
    Yapay Zeka &amp; Medeniyet Sempozyumu
  </text>

  <!-- Description -->
  <text x="320" y="260" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">
    Tüm kulüplerin ve davetli akademisyenlerin katılımıyla büyük konferans
  </text>

  <!-- Event Details Pills -->
  <g transform="translate(140, 310)">
    <rect x="0" y="0" width="110" height="38" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="55" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">📅 18 Ekim 2026</text>
    
    <rect x="125" y="0" width="110" height="38" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="180" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">⏰ 19:30</text>
    
    <rect x="250" y="0" width="110" height="38" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="305" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="middle">📍 Konferans Salonu</text>
  </g>
</svg>
