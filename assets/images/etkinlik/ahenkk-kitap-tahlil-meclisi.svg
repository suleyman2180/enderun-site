<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="cyanDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082F49"/>
      <stop offset="50%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" rx="16" fill="url(#cyanDark)" stroke="url(#cyanGlow)" stroke-width="2"/>

  <!-- Tech Grid Background Lines -->
  <line x1="0" y1="100" x2="640" y2="100" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="0" y1="200" x2="640" y2="200" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="0" y1="300" x2="640" y2="300" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="160" y1="0" x2="160" y2="400" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="320" y1="0" x2="320" y2="400" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.15"/>
  <line x1="480" y1="0" x2="480" y2="400" stroke="#38BDF8" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Badge -->
  <rect x="230" y="30" width="180" height="32" rx="16" fill="rgba(56, 189, 248, 0.15)" stroke="url(#cyanGlow)" stroke-width="1"/>
  <text x="320" y="51" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="2">🎯 KÜÇÜK ETKİNLİK</text>

  <!-- Title -->
  <text x="320" y="175" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
    İZBİTECH ATÖLYESİ
  </text>
  <text x="320" y="210" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="700" fill="url(#cyanGlow)" text-anchor="middle">
    3D Yazıcı &amp; Drone Pilotaj Eğitimi
  </text>

  <!-- Description -->
  <text x="320" y="255" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#94A3B8" text-anchor="middle">
    Uygulamalı prototip baskısı ve simülasyon eşliğinde drone uçuş pratikleri
  </text>

  <!-- Event Details Pills -->
  <g transform="translate(140, 310)">
    <rect x="0" y="0" width="110" height="38" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="55" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">📅 12 Ekim 2026</text>
    
    <rect x="125" y="0" width="110" height="38" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="180" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#FFFFFF" text-anchor="middle">⏰ 16:30</text>
    
    <rect x="250" y="0" width="110" height="38" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)"/>
    <text x="305" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="middle">📍 İzbitech Lab</text>
  </g>
</svg>
